<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="retroagent: every session, every machine, one search">
  <title>retroagent</title>
  <rect width="1280" height="400" rx="24" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <!-- mark: the logo without its tile -->
  <g transform="translate(64 120) scale(0.625)">
    <g transform="translate(3 0)">
      <path d="M 59.1 160.1 A 76 76 0 1 0 60.3 93.5" fill="none" stroke="#FFB000" stroke-width="20" stroke-linecap="round"/>
      <path d="M 46.7 116.8 L 41.4 78 L 83 102 Z" fill="#FFB000" stroke="#FFB000" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 101 104 L 125 128 L 101 152" fill="none" stroke="#FFE2A8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="135" y="139" width="32" height="15" rx="4" fill="#FFE2A8"/>
    </g>
  </g>

  <!-- wordmark with cursor -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="244" y="204" font-size="72" font-weight="700" fill="#FAFAFA" letter-spacing="-1">retroagent</text>
    <rect x="690" y="152" width="32" height="58" fill="#FFB000"/>
    <text x="248" y="252" font-size="17" fill="#A1A1AA">Every session. Every machine. One search.</text>
    <text x="248" y="292" font-size="14" fill="#52525B" letter-spacing="1.5">A CLAUDE CODE AND CODEX PLUGIN</text>
  </g>

  <!-- terminal transcript -->
  <g transform="translate(790 88)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <rect width="426" height="272" rx="14" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="22" y="40" fill="#FAFAFA"><tspan fill="#FFB000">›</tspan> kb find "login redirect"</text>
    <g fill="#71717A">
      <text x="38" y="76">a3f9c2e1</text><text x="116" y="76" fill="#B38A2E">claude</text><text x="180" y="76" fill="#FAFAFA">redirect loop</text>
      <text x="38" y="102">7b20d4aa</text><text x="116" y="102" fill="#B38A2E">codex</text><text x="180" y="102" fill="#FAFAFA">SameSite cookie</text>
      <text x="38" y="128">e51c08f3</text><text x="116" y="128" fill="#B38A2E">claude</text><text x="180" y="128" fill="#FAFAFA">token refresh</text>
      <text x="38" y="154">page</text><text x="116" y="154" fill="#B38A2E">retro</text><text x="180" y="154" fill="#FAFAFA">auth, week 41</text>
      <text x="38" y="180">…</text><text x="116" y="180">9 more hits</text>
    </g>
    <g fill="#52525B" text-anchor="end">
      <text x="400" y="76">laptop</text>
      <text x="400" y="102">desktop</text>
      <text x="400" y="128">cloud</text>
      <text x="400" y="154">routine</text>
    </g>
    <line x1="22" y1="202" x2="404" y2="202" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="22" y="236" fill="#FFB000" font-weight="700">↺ synced <tspan fill="#FAFAFA" font-weight="400">3 machines, 1 private repo</tspan></text>
    <text x="400" y="258" fill="#52525B" text-anchor="end" font-size="12">a Git repo that you own</text>
  </g>
</svg>
