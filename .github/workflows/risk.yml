# Risk tier of each pull request: the deterministic rules of .github/scripts/risk_tier.py,
# read from the BASE branch (rules and script), so a PR cannot loosen its own tier.
# Shadow week: advisory and NOT a required check. It posts the tier as the "risk tier" check
# and as a risk:* label, and never merges, approves or fails a PR.
# Kill switch: the repo variable AUTOMERGE=off makes every PR T2-hard.
name: risk

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write   # the risk:* label
  checks: write          # the "risk tier" check run

concurrency:
  group: risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    # The tests of the PR's own classifier.
    name: risk (classifier tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.12 --with pyyaml==6.0.2 --with pytest -- python -m pytest -q .github/scripts

  tier:
    name: risk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Rules and classifier from the base branch
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          dir="$RUNNER_TEMP/risk-base"; mkdir -p "$dir"
          if git show "$BASE_SHA:.github/risk.yml" > "$dir/risk.yml" 2>/dev/null \
             && git show "$BASE_SHA:.github/scripts/risk_tier.py" > "$dir/risk_tier.py" 2>/dev/null; then
            echo "note=Rules and classifier read from the base branch ($BASE_SHA)." >> "$GITHUB_OUTPUT"
          else
            # Bootstrap: the PR that adds the classifier. It touches .github/risk.yml, so it is T2-hard anyway.
            cp .github/risk.yml .github/scripts/risk_tier.py "$dir/"
            echo "::notice title=risk::The base branch has no classifier yet: this run uses the PR's own rules (bootstrap)."
            echo "note=Bootstrap: the base branch has no classifier yet, so this run uses the PR's own rules." >> "$GITHUB_OUTPUT"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Classify
        id: tier
        env:
          DIR: ${{ steps.base.outputs.dir }}
          NOTE: ${{ steps.base.outputs.note }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # untrusted PR text: passed through env and files, never into the shell
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          AUTOMERGE: ${{ vars.AUTOMERGE }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.txt"
          uv run --no-project --python 3.12 --with pyyaml==6.0.2 -- python "$DIR/risk_tier.py" \
            --rules "$DIR/risk.yml" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --title="$PR_TITLE" --branch="$PR_BRANCH" --body-file "$RUNNER_TEMP/body.txt" \
            --automerge="$AUTOMERGE" --note="$NOTE" \
            --json "$RUNNER_TEMP/risk.json" --markdown "$RUNNER_TEMP/risk.md"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("tier="+d["tier"]); print("label="+d["label"])' \
            "$RUNNER_TEMP/risk.json" >> "$GITHUB_OUTPUT"
          if [ "$AUTOMERGE" = "off" ]; then echo "::notice title=risk::AUTOMERGE=off: every PR is T2-hard."; fi
          cat "$RUNNER_TEMP/risk.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Label
        # A PR from a fork gets a read-only token: the label is skipped, the tier stays in the summary.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ steps.tier.outputs.label }}
        run: |
          for old in $(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name | select(startswith("risk:"))'); do
            [ "$old" = "$LABEL" ] || gh api -X DELETE "repos/$REPO/issues/$PR/labels/$old" > /dev/null
          done
          gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=$LABEL" > /dev/null

      - name: Check run "risk tier"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - "$RUNNER_TEMP/risk.json" "$RUNNER_TEMP/risk.md" > "$RUNNER_TEMP/check.json" <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          # Shadow week: T0/T1 success, T2 and HOLD neutral. Never a failure.
          conclusion = "success" if d["tier"] in ("T0", "T1") else "neutral"
          print(json.dumps({"name": "risk tier", "head_sha": os.environ["HEAD_SHA"], "status": "completed",
                            "conclusion": conclusion,
                            "output": {"title": f"{d['tier']}: {d['meaning']}", "summary": open(sys.argv[2]).read()[:60000]}}))
          PY
          gh api "repos/$REPO/check-runs" --input "$RUNNER_TEMP/check.json" > /dev/null
