# Automated review of each pull request, two passes in one job:
#   1. shall: the change against the engineering standards (the organisation corpus of
#      gabe4coding/shall, pinned below). Adapted from shall's ci/github/shall-review.yml.
#   2. A general pass (.github/scripts/general_review.py): bugs, a missing or weakened test,
#      silent behavior changes, PR body vs diff drift, anything irreversible.
# Shadow week: advisory and NOT a required check. Findings are posted as PR comments, and the job
# summary says what the pilot would do (block on a verified finding, raise the tier on an error).
# The job never fails a PR this week.
#
# Secrets (repo settings > Secrets and variables > Actions). Without them the job skips with a notice:
#   TYPESAFE_API_KEY                               shall's Jev selection of the rules (pass 1)
#   ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN    `claude -p` for both passes
# Data: the diff and the PR text go to TypeSafe (pass 1) and Anthropic (both passes).
# Trust: on `pull_request` the PR's own version of this file runs. The PR text is untrusted input.
name: review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write   # review comments and the summary comment

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SHALL_REF: dd6b61ea6c286fa8a1abc5ed8e8f983e84445da7          # gabe4coding/shall main, 2026-10-18
  SHALL_EXTENDS: gabe4coding/shall@dd6b61ea6c286fa8a1abc5ed8e8f983e84445da7
  JRFC: .shall-tooling/plugins/shall/bin
  CLAUDE_CODE_VERSION: 2.1.296
  REVIEW_MODEL: claude-sonnet-5

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Secrets
        id: secrets
        env:
          TS: ${{ secrets.TYPESAFE_API_KEY }}
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
          OT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude=false; shall=false
          if [ -n "$AK$OT" ]; then claude=true; fi
          if [ "$claude" = true ] && [ -n "$TS" ]; then shall=true; fi
          echo "claude=$claude" >> "$GITHUB_OUTPUT"; echo "shall=$shall" >> "$GITHUB_OUTPUT"
          if [ "$claude" = false ]; then
            msg="Review skipped: add the repo secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN), and TYPESAFE_API_KEY for shall."
            echo "::notice title=review::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$shall" = false ]; then
            msg="shall pass skipped: add the repo secret TYPESAFE_API_KEY. The general pass runs."
            echo "::notice title=review::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.claude == 'true'
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.shall == 'true'
        with:
          repository: gabe4coding/shall
          ref: ${{ env.SHALL_REF }}
          path: .shall-tooling
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.claude == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.claude == 'true'
        with: { node-version: "24" }
      - if: steps.secrets.outputs.claude == 'true'
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Restore corpus, grammar and Jev answer caches
        if: steps.secrets.outputs.shall == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/shall
            ~/.cache/tree-sitter-language-pack
            .shall/.shall-cache
            .shall-cache
          key: shall-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: shall-${{ github.event.pull_request.number }}-

      - name: shall review
        id: shall
        if: steps.secrets.outputs.shall == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Exit codes: 0 ok, 2 blocking findings, 3 Jev service failure, 1 other error.
        # Shadow week: record the code, never fail the job.
        run: |
          set +e
          "$JRFC/shall" prefetch
          "$JRFC/shall-pr-review" --post "$PR" --fail-on-blocking
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: General pass
        id: general
        if: steps.secrets.outputs.claude == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          python3 .github/scripts/general_review.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --event "$GITHUB_EVENT_PATH" --model "$REVIEW_MODEL" --out .review-out --post
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always() && steps.secrets.outputs.claude == 'true'
        env:
          SHALL: ${{ steps.shall.outputs.code }}
          GENERAL: ${{ steps.general.outputs.code }}
        run: |
          say() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          say "### review (shadow week, advisory)"
          case "$SHALL" in
            0) say "- shall: no blocking finding." ;;
            2) say "- shall: blocking findings (enforced MUST, verified). The pilot would block this PR."
               echo "::warning title=review::shall found blocking findings (advisory this week)." ;;
            "") say "- shall: skipped (no TYPESAFE_API_KEY)." ;;
            *) say "- shall: reviewer error (exit $SHALL). The pilot would keep the check pending and raise the tier."
               echo "::warning title=review::shall failed with exit $SHALL (advisory this week)." ;;
          esac
          case "$GENERAL" in
            0) say "- general pass: no blocking finding." ;;
            2) say "- general pass: a verified high-severity finding. The pilot would block this PR."
               echo "::warning title=review::the general pass found a blocking issue (advisory this week)." ;;
            *) say "- general pass: reviewer error (exit $GENERAL). The pilot would raise the tier."
               echo "::warning title=review::the general pass failed with exit $GENERAL (advisory this week)." ;;
          esac
          cat .shall-out/pr/review.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat .review-out/general.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.secrets.outputs.claude == 'true'
        with:
          name: review
          path: |
            .shall-out/pr
            .review-out
          if-no-files-found: ignore
