# Runs scripts/test --all, the same check a contributor runs before a commit, on every push to main and every PR.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux only: macOS runners cost ten times more. Python 3.9 stands in for macOS /usr/bin/python3, the runtime target.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: scripts/test --all
        env:
          KB_TEST_PYTHON: ${{ matrix.python }}
        run: scripts/test --all -rs
